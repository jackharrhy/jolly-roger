[project]
name = "jolly-roger"
version = "0.1.0"
description = "Port forwarding for Rogers gateways without the app"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28", "python-dotenv>=1.0", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
browser = ["playwright>=1.49"]

[project.scripts]
jolly-roger = "jolly_roger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "playwright>=1.49"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
