[project]
name = "jolly-roger"
version = "0.1.0"
description = "Local port forwarding for supported routers without the app"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.1", "python-dotenv>=1.2.4", "beautifulsoup4>=4.15.0"]

[project.optional-dependencies]
browser = ["playwright>=1.64.1"]

[project.scripts]
jolly-roger = "jolly_roger.cli:main"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "playwright>=1.64.1",
    "mypy>=2.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
